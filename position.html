<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height:2000vh;
        }
        .navbar{
            position:sticky;
            top:0;
        }
        .relative{
            border:2px solid red;
            position:relative;
            height:200px;
            margin-top:20px;
        }
        .absolute{
            border:2px solid blue;
            position:absolute;
            margin:10px;
           margin-left:50px;
        }
        .fixed{
            position:fixed;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <nav>
            <u1>
                <li>HOME</li>
                <li>ABOUT</li>
                <li>CONTACT</li>
                <li>SERVICE</li>
            </u1>
        </nav>
    </div>
    <div class="relative">
        <h1>relative</h1>
        <div class="absolute">
            <h1>absolute</h1>
        
    
</body>
</html>
